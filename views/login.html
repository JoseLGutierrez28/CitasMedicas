<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Citas Médicas</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-600 to-purple-700 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl overflow-hidden">
        <div class="bg-gradient-to-r from-blue-600 to-purple-600 p-6 text-center">
            <h1 class="text-2xl font-bold text-white">🏥 Sistema de Citas Médicas</h1>
            <p class="text-blue-100 mt-1">Gestión inteligente de agenda</p>
        </div>
        
        <div class="p-8">
            <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">Iniciar Sesión</h2>
            
            <form action="/login" method="POST" class="space-y-4">
                <div>
                    <label class="block text-gray-700 font-medium mb-2">📧 Correo Electrónico</label>
                    <input type="email" name="email" required 
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                           placeholder="ejemplo@correo.com">
                </div>
                
                <div>
                    <label class="block text-gray-700 font-medium mb-2">🔒 Contraseña</label>
                    <input type="password" name="password" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                           placeholder="••••••">
                </div>
                
                <button type="submit" 
                        class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white font-semibold py-3 rounded-xl hover:from-blue-700 hover:to-purple-700 transition shadow-lg">
                    Ingresar
                </button>
            </form>
            
            <p class="text-center text-gray-600 mt-6">
                ¿No tienes cuenta? 
                <a href="/register" class="text-blue-600 hover:text-blue-800 font-semibold">Regístrate aquí</a>
            </p>
            
            <div class="mt-8 bg-gray-50 rounded-xl p-4">
                <h3 class="font-semibold text-gray-700 text-sm mb-2">🔐 Credenciales de prueba:</h3>
                <div class="space-y-1 text-xs text-gray-600">
                    <p><span class="font-medium">Paciente:</span> juan.perez@email.com / 123456</p>
                    <p><span class="font-medium">Médico:</span> dra.martinez@citas.com / 123456</p>
                    <p><span class="font-medium">Admin:</span> admin@citas.com / 123456</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
