<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sistema de Citas Médicas</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-600 to-purple-700 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl overflow-hidden">
        <div class="bg-gradient-to-r from-blue-600 to-purple-600 p-6 text-center">
            <h1 class="text-2xl font-bold text-white">📝 Registro de Paciente</h1>
            <p class="text-blue-100 mt-1">Crea tu cuenta gratis</p>
        </div>
        
        <div class="p-8">
            <form action="/register" method="POST" class="space-y-4">
                <div>
                    <label class="block text-gray-700 font-medium mb-2">👤 Nombre Completo</label>
                    <input type="text" name="nombre" required 
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>
                
                <div>
                    <label class="block text-gray-700 font-medium mb-2">📧 Correo Electrónico</label>
                    <input type="email" name="email" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>
                
                <div>
                    <label class="block text-gray-700 font-medium mb-2">📱 Teléfono</label>
                    <input type="tel" name="telefono"
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>
                
                <div>
                    <label class="block text-gray-700 font-medium mb-2">🔒 Contraseña</label>
                    <input type="password" name="password" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>
                
                <button type="submit" 
                        class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white font-semibold py-3 rounded-xl hover:from-blue-700 hover:to-purple-700 transition shadow-lg">
                    Registrarse
                </button>
            </form>
            
            <p class="text-center text-gray-600 mt-6">
                ¿Ya tienes cuenta? 
                <a href="/login" class="text-blue-600 hover:text-blue-800 font-semibold">Inicia sesión aquí</a>
            </p>
        </div>
    </div>
</body>
</html>
